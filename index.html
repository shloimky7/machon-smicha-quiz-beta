<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Machon Smicha Quiz Beta</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">
            <img src="assets/machon-smicha-logo.png" alt="Machon Smicha" />
          </div>
          <div>
            <p class="eyebrow">Machon Smicha</p>
            <h1>Machon Smicha Smicha Quizzes - Beta</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="secondary-action home-action hidden" id="homeButton" type="button">Home</button>
          <div class="status-pill" id="bankStatus">Loading quizzes</div>
        </div>
      </header>

      <main>
        <section class="panel setup-panel" id="setupPanel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Question Bank</p>
              <h2>Machon Smicha Smicha Quizzes - Beta</h2>
            </div>
          </div>

          <div class="course-list" id="courseList"></div>

          <section class="course-quiz-panel hidden" id="courseQuizPanel">
            <div class="course-panel-top">
              <div>
                <p class="eyebrow">Choose Quiz</p>
                <h3 id="selectedCourseTitle">Course</h3>
                <p id="selectedCourseMeta"></p>
              </div>
              <button class="secondary-action" id="backToCoursesButton" type="button">Back to Courses</button>
            </div>

            <div class="quiz-list" id="quizList"></div>

            <section class="start-panel hidden" id="startPanel">
              <div>
                <p class="eyebrow">Ready to Start</p>
                <h3 id="chosenQuizTitle">Quiz</h3>
              </div>

              <fieldset class="review-mode">
                <legend>Answer Review</legend>
                <label class="mode-choice">
                  <input type="radio" name="reviewMode" value="immediate" checked />
                  <span>
                    <strong>After each question</strong>
                    <small>Check each answer before moving on.</small>
                  </span>
                </label>
                <label class="mode-choice">
                  <input type="radio" name="reviewMode" value="end" />
                  <span>
                    <strong>At the end</strong>
                    <small>Finish the quiz first, then review everything.</small>
                  </span>
                </label>
              </fieldset>

              <button class="primary-action" id="startSelectedQuizButton" type="button">Start Quiz</button>
            </section>
          </section>
        </section>

        <section class="panel quiz-panel hidden" id="quizPanel">
          <div class="quiz-topline">
            <div>
              <p class="eyebrow" id="quizCourse">Course</p>
              <h2 id="quizTitle">Quiz</h2>
            </div>
            <div class="progress-box">
              <span id="progressText">1 / 1</span>
              <div class="progress-track"><div id="progressBar"></div></div>
            </div>
          </div>

          <div class="question-card">
            <div class="question-meta">
              <span id="difficultyBadge">Easy</span>
            </div>
            <h3 id="questionText"></h3>
            <div class="options-list" id="optionsList"></div>
          </div>

          <div class="quiz-actions">
            <button class="secondary-action" id="backButton" type="button">Previous Question</button>
            <button class="primary-action" id="nextButton" type="button">Next</button>
          </div>
        </section>

        <section class="results-panel hidden" id="resultsPanel">
          <div class="results-hero">
            <div>
              <p class="eyebrow">Results</p>
              <h2 id="scoreTitle"></h2>
              <p id="scoreSubtext"></p>
            </div>
            <button class="secondary-action" id="newAttemptButton" type="button">Retake Quiz</button>
          </div>

          <div class="review-list" id="reviewList"></div>
        </section>
      </main>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
